name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome ci .

  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:newsletter
      - name: Smoke test built Worker in hidden and editorial preview modes
        shell: bash
        run: |
          for editorial in preview hidden; do
            SD_EDITORIAL_MODE="$editorial" npm run cloudflare:build -- --mode staging
            SD_CLOUDFLARE_BUILD=1 node node_modules/vite/bin/vite.js preview \
              --host 127.0.0.1 --mode staging --port 4182 --strictPort &
            preview_pid=$!
            trap 'kill "$preview_pid"' EXIT
            curl --fail --silent --show-error --retry 20 --retry-connrefused \
              --retry-delay 1 --max-time 2 --output /dev/null http://127.0.0.1:4182/
            npm run smoke:routes -- http://127.0.0.1:4182 --cloudflare --editorial="$editorial"
            kill "$preview_pid"
            wait "$preview_pid" || true
            trap - EXIT
          done
      - run: npm test
      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
